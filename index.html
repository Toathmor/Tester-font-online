<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toathmor Font Studio v3.8</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Toathmor Studio">
    <link class="apple-touch-icon" rel="apple-touch-icon" href="https://i.postimg.cc/Dft6G1fW/IMG-3108.png">
    
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlRvYXRobW9yIEZvbnQgU3R1ZGlvIiwKICAic2hvcnxfbmFtZSI6ICJUb2F0aG1vciIsCiAgInស៊រៀល_dXJsIjogIi4uIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGIwZjE5IiwKICAidGhlbWVfY29sb3IiOiAiIzBiMGYxOSIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImh0dHBzOi8vaS5wb3N0aW1nLmNjL0RmdDZHMW vXL0lNRy0zMTA4LnBuZyIsCiAgICAgICJzaXplcyI6ICIxOTJ4MTkyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-app: #0b0f19;          
            --bg-card: #111827;         
            --bg-item: #1f2937;
            --text-main: #f8fafc;       
            --text-muted: #94a3b8;      
            --border: #334155;          
            --accent: #6366f1;          
            --accent-hover: #4f46e5;
            --accent-light: rgba(99, 102, 241, 0.15);
            --preview-bg: #ffffff;      
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 12px 30px rgba(0,0,0,0.5);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px; 
        }

        [data-theme="dark"] {
            --bg-app: #070a12;
            --bg-card: #0f172a;
            --bg-item: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border: #1e293b;
            --preview-bg: #0f172a; 
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Kantumruy Pro', system-ui, sans-serif;
            margin: 0; padding: 0;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 1260px;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 1fr; gap: 20px; }
            body { padding: 12px; }
        }

        .control-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: fit-content;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo-title { 
            font-size: 16px; 
            font-weight: 700; 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        
        /* 🛠️ កែសម្រួលប្រអប់ឡូហ្គោឱ្យមូលក្លំ និងបង្ហាញពេញផ្ទៃដូច Facebook Profile */
        .header-brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            overflow: hidden;
            border-radius: 50%; /* ប្តូរទៅជាស៊ុមមូលដូច Facebook */
            background: #000000;     
            border: 1px solid var(--border);
            padding: 0; /* ជម្រុះ padding ចេញដើម្បីឱ្យរូបភាពរត់ដល់គែម */
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        
        .header-brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ប្រើ cover ដើម្បីឱ្យរូបភាពពេញរង្វង់មូល */
            display: block;
        }

        .logo-title span { color: var(--accent); font-size: 11px; font-weight: 600; background: var(--accent-light); padding: 4px 10px; border-radius: 30px; letter-spacing: 0.5px; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .global-font-lbl {
            background: var(--accent); color: white; padding: 8px 16px; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: var(--shadow-sm); transition: transform 0.15s, background-color 0.2s;
        }
        .global-font-lbl:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .btn-theme {
            background: var(--bg-item); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: var(--radius-sm);
            color: var(--text-main); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-theme:hover { background: var(--border); color: #fbbf24; }

        .tabs-nav {
            display: flex;
            background: var(--bg-app);
            padding: 4px;
            border-radius: var(--radius-md);
            gap: 4px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1; text-align: center; padding: 10px; background: transparent; border: none;
            color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .tab-btn.active {
            background: var(--bg-item); color: var(--accent); box-shadow: var(--shadow-sm);
        }

        .tab-content { display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        .accordion-row-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .group-box {
            flex: 1; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            padding: 12px; 
            background: var(--bg-item);
            display: flex; 
            flex-direction: column;
            min-width: 0; 
        }
        
        .group-header-clickable {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            cursor: pointer; 
            user-select: none; 
            padding: 4px 0;
        }
        
        .group-box:not(.collapsed) {
            flex: none;
            width: 100%;
        }

        .accordion-row-group.has-active .group-box.collapsed {
            display: none; 
        }

        .group-box:not(.collapsed) .group-header-clickable {
            border-bottom: 1px dashed var(--border);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        
        .group-title {
            font-size: 12px; font-weight: 600; color: #cbd5e1;
            display: flex; align-items: center; gap: 8px; pointer-events: none;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .group-title i { color: var(--accent); font-size: 13px; }
        
        .collapse-icon {
            font-size: 10px; color: var(--text-muted);
            transition: transform 0.2s ease; pointer-events: none;
        }
        
        .group-body-collapsible {
            display: flex; flex-direction: column; gap: 12px;
            overflow: hidden;
        }
        
        .group-box.collapsed .group-body-collapsible { display: none !important; }
        .group-box.collapsed .collapse-icon { transform: rotate(-90deg); }

        .ctrl-row { 
            display: grid;
            grid-template-columns: 110px 1fr;
            align-items: center; 
            gap: 12px; 
            font-size: 12px; 
            width: 100%; 
        }
        .ctrl-row.full-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ctrl-row-header label { font-weight: 500; color: var(--text-muted); white-space: nowrap; }
        
        .slider-wrapper { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; }
        .input-slider { 
            flex: 1; min-width: 0; height: 6px; accent-color: var(--accent); cursor: pointer; 
            background: var(--bg-app); border-radius: 10px; appearance: none; -webkit-appearance: none;
        }
        .input-slider::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--text-main); border: 2px solid var(--accent); box-shadow: var(--shadow-sm); }
        .val-indicator { min-width: 45px; text-align: right; color: var(--text-main); font-weight: 600; font-size: 11px; background: var(--bg-app); padding: 2px 6px; border-radius: 4px; }

        .select-custom {
            width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--bg-app); color: var(--text-main); outline: none; cursor: pointer; font-weight: 500; font-size: 12px;
        }

        .input-actions-flex { 
            display: flex; 
            gap: 8px; 
            width: 100%; 
            align-items: center; 
            min-width: 0; 
            flex-wrap: wrap; 
        }
        
        .btn-group { 
            display: flex; 
            background: var(--bg-app); 
            padding: 2px; 
            border-radius: var(--radius-sm); 
            border: 1px solid var(--border); 
            width: fit-content; 
            flex-shrink: 0; 
            flex: 1; 
            min-width: 120px; 
        }
        
        .mini-btn {
            flex: 1;
            padding: 6px; border: none; background: transparent;
            color: var(--text-muted); border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600;
            text-align: center; white-space: nowrap;
        }
        .mini-btn:hover { color: var(--text-main); }
        .mini-btn.active { background: var(--accent); color: white; }

        .switch { 
            position: relative; display: inline-block; width: 38px; height: 20px; 
            flex-shrink: 0 !important; max-width: 38px; max-height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; display: none; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .2s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(18px); }

        .file-lbl {
            padding: 8px 12px; background: var(--bg-app); color: var(--text-main); border-radius: var(--radius-sm);
            cursor: pointer; font-size: 11px; font-weight: 600; border: 1px solid var(--border); white-space: nowrap;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .file-lbl:hover { border-color: var(--accent); color: var(--accent); }
        .file-hidden { display: none; }

        .monitor-panel { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 24px; height: fit-content; }
        
        .ratio-and-samples {
            display: flex; flex-direction: column; gap: 10px; background: var(--bg-card);
            padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
        }
        .sample-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; font-weight: 500; color: var(--text-muted); }
        .sample-pill { background: var(--bg-item); border: 1px solid var(--border); padding: 5px 12px; border-radius: 30px; cursor: pointer; color: var(--text-main); font-size: 11px; font-weight: 500; }
        .sample-pill:hover, .ratio-pill:hover { border-color: var(--accent); color: var(--accent); }
        .sample-bar .btn-clear { margin-left: auto; background: transparent; border: none; color: #ef4444; font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 8px; display: inline-flex; align-items: center; gap: 4px; }
        .sample-bar .btn-clear:hover { opacity: 0.8; }
        
        .ratio-bar { display: flex; gap: 8px; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 10px; flex-wrap: wrap; }
        .ratio-pill {
            background: var(--bg-item); border: 1px solid var(--border); padding: 6px 14px; border-radius: var(--radius-sm);
            cursor: pointer; color: var(--text-main); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
        }
        .ratio-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

        .quick-color-box {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm);
        }
        .quick-color-header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .quick-color-title { font-size: 12px; font-weight: 600; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; }
        .quick-color-title i { color: #f59e0b; }
        
        .canvas-picker-inline { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--text-muted); }
        .canvas-picker-inline input[type="color"] { border: 1px solid var(--border); background: transparent; width: 26px; height: 20px; cursor: pointer; border-radius: 4px; }

        .palette-flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .palette-item {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ffffff; 
            box-shadow: 0 0 0 1px var(--border); cursor: pointer; position: relative; overflow: hidden;
            display: flex; transform: scale(1); transition: transform 0.15s ease;
        }
        .palette-item:hover { transform: scale(1.1); }
        .p-split { flex: 1; height: 100%; }

        .preview-frame {
            width: 100%; background: rgba(0,0,0,0.2); border-radius: var(--radius-lg); overflow: hidden;
            border: 1px solid var(--border); box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center;
            padding: 12px;
        }

        .viewport-canvas {
            width: 100%; box-sizing: border-box; display: flex; flex-direction: column;
            padding: 45px 55px; background: var(--preview-bg); position: relative; justify-content: center;
            overflow: hidden; word-wrap: break-word; border-radius: 8px;
        }
        
        .viewport-canvas.ratio-16-9 { aspect-ratio: 16 / 9; }
        .viewport-canvas.ratio-1-1 { aspect-ratio: 1 / 1; }
        .viewport-canvas.ratio-3-4 { aspect-ratio: 3 / 4; }

        .block-editable {
            width: 100%; background: transparent; border: none; outline: none;
            white-space: pre-wrap !important; 
            word-wrap: break-word; word-break: break-word; position: relative; margin: 0;
        }
        .block-editable * {
            font-family: inherit !important; font-size: inherit !important;
            line-height: inherit !important; color: inherit !important; letter-spacing: inherit !important;
        }
        .block-editable:empty:before { content: attr(placeholder); color: #64748b; opacity: 0.5; }

        .view-title { font-size: 32px; text-align: center; margin-bottom: 16px; font-weight: normal; color: #0f172a; }
        /* 🛠️ កែប្រែអត្ថបទគំរូឱ្យប្រើប្រាស់សញ្ញាខណ្ឌ (។) តាមក្បួនខ្នាតខ្មែរ */
        .view-main { font-size: 18px; text-align: center; min-height: 50px; margin-bottom: 24px; line-height: 1.6; color: #0f172a; }
        .view-footer { font-size: 13px; text-align: right; margin-top: auto; color: #64748b; font-weight: normal; }

        .node-hidden { display: none !important; }

        .logo-box { width: 100%; display: none; margin-bottom: 12px; }
        .logo-node { max-height: 45px; max-width: 120px; object-fit: contain; border-radius: 6px; }
        .center-logo-box { position: absolute; pointer-events: none; display: none; }
        .center-logo-box img { width: 100%; height: 100%; object-fit: contain; }

        .bottom-bar { display: flex; gap: 12px; }
        .action-btn {
            flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-md);
            font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 8px; background: var(--bg-card); color: var(--text-main); box-shadow: var(--shadow-sm);
        }
        .action-btn:hover { background: var(--bg-item); }
        .action-btn.primary-btn { background: var(--accent); color: white; border-color: var(--accent); }

        @media (max-width: 600px) {
            .accordion-row-group { flex-direction: column; }
            .control-panel { padding: 16px; gap: 12px; }
            .viewport-canvas { padding: 24px 28px; }
            .view-title { font-size: 24px; }
            .view-main { font-size: 15px; }
            .bottom-bar { flex-direction: column; gap: 10px; }
            .ctrl-row { grid-template-columns: 1fr; gap: 4px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="control-panel">
        <div class="app-header">
            <div class="logo-title">
                <span class="header-brand-icon" id="headerLogoContainer"></span>
                ស្ទូឌីយ៉ូពុម្ពអក្សរ <span>Toathmor v3.8</span>
            </div>
            <div class="header-actions">
                <label class="global-font-lbl" for="globalFontFile"><i class="fa-solid fa-cloud-arrow-up"></i> ផ្ទុកពុម្ពរួម</label>
                <input type="file" id="globalFontFile" class="file-hidden" accept=".ttf,.otf,.woff,.woff2" multiple>
                <button class="btn-theme" id="themeToggleBtn"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" id="btnTabTxt" onclick="switchTab('text-tab')"><i class="fa-solid fa-pen-nib"></i> អក្សររចនា</button>
            <button class="tab-btn" id="btnTabLogo" onclick="switchTab('logo-tab')"><i class="fa-solid fa-shield-halved"></i> និមិត្តសញ្ញា</button>
        </div>

        <div id="text-tab" class="tab-content active">
            <div class="accordion-row-group" id="rowGroup">
                
                <div class="group-box collapsed" id="boxHeader">
                    <div class="group-header-clickable" onclick="toggleAccordion('boxHeader')">
                        <div class="group-title"><i class="fa-solid fa-heading"></i> Header</div>
                        <span class="collapse-icon"><i class="fa-solid fa-chevron-down"></i></span>
                    </div>
                    <div class="group-body-collapsible">
                        <div class="ctrl-row full-flex"><div class="ctrl-row-header"><label>បង្ហាញ៖</label></div><label class="switch"><input type="checkbox" id="vHeader" checked onchange="updateVisibility('header')"><span class="slider"></span></label></div>
                        <div class="ctrl-row">
                            <div class="ctrl-row-header"><label>ពុម្ពអក្សរ៖</label></div>
                            <div class="input-actions-flex">
                                <select id="hFont" class="select-custom"><option value="'Kantumruy Pro'">Kantumruy Pro</option></select>
                                <label class="file-lbl" for="hFFile"><i class="fa-solid fa-folder-plus"></i></label><input type="file" id="hFFile" class="file-hidden" accept=".ttf,.otf,.woff,.woff2" multiple>
                            </div>
                        </div>
                        <div class="ctrl-row">
                            <div class="ctrl-row-header"><label>ទំហំអក្សរ៖</label></div>
                            <div class="slider-wrapper"><input type="range" id="hSize" class="input-slider" min="16" max="70" value="32"><span class="val-indicator" id="hSizeLbl">32px</span></div>
                        </div>
                        <div class="ctrl-row">
                            <div class="ctrl-row-header"><label>គម្លាតជួរ៖</label></div>
                            <div class="slider-wrapper"><input type="range" id="hLine" class="input-slider" min="1" max="2.5" step="0.1" value="1.4"><span class="val-indicator" id="hLineLbl">1.4</span></div>
                        </div>
                        <div class="ctrl-row">
                            <div class="ctrl-row-header"><label>គម្លាតតួ៖</label></div>
                            <div class="slider-wrapper"><input type="range" id="hSpace" class="input-slider" min="-2" max="10" step="0.5" value="0"><span class="val-indicator" id="hSpaceLbl">0px</span></div>
                        </div>
                        <div class="ctrl-row">
                            <div class="ctrl-row-header"><label>តម្រឹម៖</label></div>
                            <div class="input-actions-flex">
                                <div class="btn-group">
                                    <button class="mini-btn" id="hB" onclick="toggleTextFormat('header','B')">B</button>
                                    <button class="mini-btn" id="hI" onclick="toggleTextFormat('header','I')">I</button>
                                </div>
                                <div class="btn-group">
                                    <button class="mini-btn" id="hALeft" onclick="setTextAlignment('header','left')">ឆ្វេង</button>
                                    <button class="mini-btn active" id="hACenter" onclick="setTextAlignment('header','center')">កណ្ដាល</button>
                                </div>
                            </div>

<script>
    const vTitle = document.getElementById('vTitle');
    const vMainText = document.getElementById('vMainText');
    const vFooterText = document.getElementById('vFooterText');
    const vCanvas = document.getElementById('vCanvas');

    const hFont = document.getElementById('hFont');
    const mFont = document.getElementById('mFont');
    const fFont = document.getElementById('fFont');

    const hSize = document.getElementById('hSize');
    const mSize = document.getElementById('mSize');
    const fSize = document.getElementById('fSize');
    
    const hLine = document.getElementById('hLine');
    const mLine = document.getElementById('mLine');
    const hSpace = document.getElementById('hSpace');
    const mSpace = document.getElementById('mSpace');

    const hSizeLbl = document.getElementById('hSizeLbl');
    const mSizeLbl = document.getElementById('mSizeLbl');
    const fSizeLbl = document.getElementById('fSizeLbl');
    const hLineLbl = document.getElementById('hLineLbl');
    const mLineLbl = document.getElementById('mLineLbl');
    const hSpaceLbl = document.getElementById('hSpaceLbl');
    const mSpaceLbl = document.getElementById('mSpaceLbl');
    const logoScaleLbl = document.getElementById('logoScaleLbl');
    const logoAlphaLbl = document.getElementById('logoAlphaLbl');

    const hColorInput = document.getElementById('hColorInput');
    const mColorInput = document.getElementById('mColorInput');
    const fColorInput = document.getElementById('fColorInput');
    const panelBgColor = document.getElementById('panelBgColor');
    
    const logoUpload = document.getElementById('logoUpload');
    const useLogo = document.getElementById('useLogo');
    const logoScale = document.getElementById('logoScale');
    const logoAlpha = document.getElementById('logoAlpha');
    const logoPlacement = document.getElementById('logoPlacement');
    const vLogoImg = document.getElementById('vLogoImg');
    const vLogoBox = document.getElementById('vLogoBox');
    const vLogoCenterBox = document.getElementById('vLogoCenterBox');
    const vLogoCenterImg = document.getElementById('vLogoCenterImg');

    let memoryLogoImage = null;
    let currentRatioMode = "16-9";

    let textConfigs = {
        header: { bold: false, italic: false, underline: false, align: 'center', visible: true },
        main: { bold: false, italic: false, underline: false, align: 'center', visible: true },
        footer: { bold: false, italic: false, underline: false, align: 'right', visible: true }
    };

    /* 🛠️ កែសម្រួលអត្ថបទគំរូក្នុង JavaScript ឱ្យប្រើសញ្ញាខណ្ឌ (។) ទាំងអស់ */
    const textLibrary = {
        abc: "ក ខ គ ឃ ង ច ឆ ជ ឈ ញ ដ ឋ ឌ ឍ ណ ត ថ ទ ធ ប ផ ព ភ ម យ រ ល វ ស ហ ឡ អ",
        proverb: "នគរថ្កើងប្លែក សប្បាយតែភ្នែក ក្នុងចិត្តរងកម្ម។\nវិជ្ជាជាទ្រព្យគាប់ចិន្តា។",
        poem: "អនិច្ចាតោថ្មលោកកសាង មើលថាថាងយ៉ាងរស់ស្ទុះប្រែប្រាយ\nឥឡូវមកធ្លាយធ្លាក់បាក់ខ្ចាត់ខ្ចាយ ស្តាយអើយស្តាយមិនគួរមកពិការ។"
    };

    function setupHeaderLogo() {
        const container = document.getElementById('headerLogoContainer');
        if (container && HEADER_LOGO_URL) {
            container.innerHTML = `<img src="${HEADER_LOGO_URL}" alt="Toathmor Logo">`;
        }
    }
    setupHeaderLogo();

    function loadDefaultCanvasLogo() {
        vLogoImg.src = HEADER_LOGO_URL;
        vLogoCenterImg.src = HEADER_LOGO_URL;
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => { memoryLogoImage = img; drawLogoLayer(); };
        img.src = HEADER_LOGO_URL;
    }
    loadDefaultCanvasLogo();

    function changeAspectRatio(ratio) {
        currentRatioMode = ratio;
        vCanvas.className = "viewport-canvas";
        if(ratio === '16-9') vCanvas.classList.add('ratio-16-9');
        if(ratio === '1-1') vCanvas.classList.add('ratio-1-1');
        if(ratio === '3-4') vCanvas.classList.add('ratio-3-4');
        document.querySelectorAll('.ratio-pill').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function toggleAccordion(boxId) {
        const groupContainer = document.getElementById('rowGroup');
        const box = document.getElementById(boxId);
        if (!box || !groupContainer) return;
        
        const isCollapsed = box.classList.contains('collapsed');
        
        document.querySelectorAll('.group-box').forEach(b => {
            b.classList.add('collapsed');
            const icon = b.querySelector('.collapse-icon i');
            if (icon) icon.className = 'fa-solid fa-chevron-down';
        });
        groupContainer.classList.remove('has-active');

        if (isCollapsed) {
            box.classList.remove('collapsed');
            groupContainer.classList.add('has-active');
            const icon = box.querySelector('.collapse-icon i');
            if (icon) icon.className = 'fa-solid fa-chevron-up';
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(tabId === 'text-tab') document.getElementById('btnTabTxt').classList.add('active');
        if(tabId === 'logo-tab') document.getElementById('btnTabLogo').classList.add('active');
    }

    function loadSampleText(key) { 
        const vMainCheckbox = document.getElementById('vMain');
        if (vMainCheckbox && !vMainCheckbox.checked) {
            vMainCheckbox.checked = true;
            updateVisibility('main');
        }
        vMainText.innerText = textLibrary[key]; 
    }
    
    document.getElementById('actionClearBtn').addEventListener('click', () => { vTitle.innerText=''; vMainText.innerText=''; vFooterText.innerText=''; vMainText.focus(); });

    function updateVisibility(section) {
        const check = document.getElementById(`v${section.charAt(0).toUpperCase() + section.slice(1)}`);
        textConfigs[section].visible = check.checked;
        const target = section === 'header' ? vTitle : (section === 'main' ? vMainText : vFooterText);
        if(check.checked) target.classList.remove('node-hidden'); else target.classList.add('node-hidden');
    }

    function toggleTextFormat(section, mode) {
        const flag = mode === 'B' ? 'bold' : 'italic';
        textConfigs[section][flag] = !textConfigs[section][flag];
        const btn = document.getElementById(`${section.charAt(0)}${mode}`);
        if(textConfigs[section][flag]) btn.classList.add('active'); else btn.classList.remove('active');

        const target = section === 'header' ? vTitle : (section === 'main' ? vMainText : vFooterText);
        if(mode === 'B') target.style.fontWeight = textConfigs[section].bold ? 'bold' : 'normal';
        if(mode === 'I') target.style.fontStyle = textConfigs[section].italic ? 'italic' : 'normal';
    }

    function setTextAlignment(section, alignType) {
        textConfigs[section].align = alignType;
        const target = section === 'header' ? vTitle : (section === 'main' ? vMainText : vFooterText);
        target.style.textAlign = alignType;

        const prefix = section.charAt(0);
        document.getElementById(`${prefix}ALeft`).classList.remove('active');
        document.getElementById(`${prefix}ACenter`).classList.remove('active');
        if(alignType === 'left') document.getElementById(`${prefix}ALeft`).classList.add('active');
        if(alignType === 'center') document.getElementById(`${prefix}ACenter`).classList.add('active');
    }

    function applyQuickPalette(bgColor, hColor, mColor, fColor) {
        panelBgColor.value = bgColor; vCanvas.style.backgroundColor = bgColor;
        hColorInput.value = hColor; vTitle.style.color = hColor;
        mColorInput.value = mColor; vMainText.style.color = mColor;
        fColorInput.value = fColor; vFooterText.style.color = fColor;
    }

    hSize.addEventListener('input', (e) => { vTitle.style.fontSize = e.target.value + 'px'; hSizeLbl.textContent = e.target.value + 'px'; });
    mSize.addEventListener('input', (e) => { vMainText.style.fontSize = e.target.value + 'px'; mSizeLbl.textContent = e.target.value + 'px'; });
    fSize.addEventListener('input', (e) => { vFooterText.style.fontSize = e.target.value + 'px'; fSizeLbl.textContent = e.target.value + 'px'; });
    hLine.addEventListener('input', (e) => { vTitle.style.lineHeight = e.target.value; hLineLbl.textContent = e.target.value; });
    mLine.addEventListener('input', (e) => { vMainText.style.lineHeight = e.target.value; mLineLbl.textContent = e.target.value; });
    hSpace.addEventListener('input', (e) => { vTitle.style.letterSpacing = e.target.value + 'px'; hSpaceLbl.textContent = e.target.value + 'px'; });
    mSpace.addEventListener('input', (e) => { vMainText.style.letterSpacing = e.target.value + 'px'; mSpaceLbl.textContent = e.target.value + 'px'; });

    hColorInput.addEventListener('input', (e) => { vTitle.style.color = e.target.value; });
    mColorInput.addEventListener('input', (e) => { vMainText.style.color = e.target.value; });
    fColorInput.addEventListener('input', (e) => { vFooterText.style.color = e.target.value; });
    panelBgColor.addEventListener('input', (e) => { vCanvas.style.backgroundColor = e.target.value; });

    hFont.addEventListener('change', (e) => { vTitle.style.fontFamily = e.target.value; applyFontToChildren(vTitle, e.target.value); });
    mFont.addEventListener('change', (e) => { vMainText.style.fontFamily = e.target.value; applyFontToChildren(vMainText, e.target.value); });
    fFont.addEventListener('change', (e) => { vFooterText.style.fontFamily = e.target.value; applyFontToChildren(vFooterText, e.target.value); });

    function applyFontToChildren(element, fontName) {
        element.style.fontFamily = fontName;
        element.querySelectorAll('*').forEach(child => { child.style.fontFamily = fontName; });
    }

    async function cleanPasteEvent(e) { 
        e.preventDefault(); 
        let text = "";
        if (navigator.clipboard && navigator.clipboard.readText) {
            try { text = await navigator.clipboard.readText(); } catch (err) { text = (e.originalEvent || e).clipboardData.getData('text/plain'); }
        } else { text = (e.originalEvent || e).clipboardData.getData('text/plain'); }
        if (!text) return;
        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        selection.deleteFromDocument();
        selection.getRangeAt(0).insertNode(document.createTextNode(text));
        selection.collapseToEnd();
        applyFontToChildren(e.currentTarget, e.currentTarget == vTitle ? hFont.value : (e.currentTarget == vMainText ? mFont.value : fFont.value));
    }
    vTitle.addEventListener('paste', cleanPasteEvent); vMainText.addEventListener('paste', cleanPasteEvent); vFooterText.addEventListener('paste', cleanPasteEvent);

    function processFontFile(file, callback) {
        const fontNameClean = file.name.replace(/\.[^/.]+$/, "");
        const fKey = 'CustomFont_' + Date.now() + '_' + Math.floor(Math.random()*1000);
        const reader = new FileReader();
        reader.onload = function(evt) {
            const fontFaceObj = new FontFace(fKey, `url(${URL.createObjectURL(new Blob([evt.target.result], { type: 'font/ttf' }))})`);
            fontFaceObj.load().then(function(loaded) {
                document.fonts.add(loaded); callback(fKey, fontNameClean);
            });
        };
        reader.readAsArrayBuffer(file);
    }

    document.getElementById('globalFontFile').addEventListener('change', function(e) {
        Array.from(e.target.files).forEach(file => {
            processFontFile(file, function(fKey, fontNameClean) {
                [hFont, mFont, fFont].forEach(select => {
                    const o = document.createElement('option'); o.value = fKey; o.textContent = "📁 " + fontNameClean; select.appendChild(o);
                });
            });
        });
    });

    function initializeFontImporter(uploader, selectTag) {
        uploader.addEventListener('change', function(e) {
            Array.from(e.target.files).forEach(file => {
                processFontFile(file, function(fKey, fontNameClean) {
                    const o = document.createElement('option'); o.value = fKey; o.textContent = "📁 " + fontNameClean; selectTag.appendChild(o);
                });
            });
        });
    }
    initializeFontImporter(document.getElementById('hFFile'), hFont);
    initializeFontImporter(document.getElementById('mFFile'), mFont);
    initializeFontImporter(document.getElementById('fFFile'), fFont);

    logoUpload.addEventListener('change', (e) => {
        const f = e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            vLogoImg.src = evt.target.result; vLogoCenterImg.src = evt.target.result;
            const img = new Image(); img.onload = () => { memoryLogoImage = img; drawLogoLayer(); };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(f);
    });

    function drawLogoLayer() {
        if(!memoryLogoImage || !useLogo.checked) { vLogoBox.style.display = 'none'; vLogoCenterBox.style.display = 'none'; return; }
        const align = logoPlacement.value, size = parseInt(logoScale.value), alpha = parseFloat(logoAlpha.value);
        vLogoBox.style.display = 'none'; vLogoCenterBox.style.display = 'none';

        if(align === 'center') {
            vLogoCenterBox.style.display = 'block'; vLogoCenterBox.style.width = size + 'px'; vLogoCenterBox.style.opacity = alpha;
            vLogoCenterBox.style.top = '50%'; vLogoCenterBox.style.left = '50%'; vLogoCenterBox.style.transform = 'translate(-50%, -50%)';
        } else {
            vLogoBox.style.display = 'flex'; vLogoImg.style.height = size + 'px'; vLogoImg.style.opacity = alpha;
            if(align.endsWith('left')) vLogoBox.style.justifyContent = 'flex-start';
            if(align.endsWith('center')) vLogoBox.style.justifyContent = 'center';
            if(align.endsWith('right')) vLogoBox.style.justifyContent = 'flex-end';
            if(align.startsWith('top')) { if(vCanvas.firstElementChild !== vLogoBox) vCanvas.insertBefore(vLogoBox, vCanvas.firstChild); }
            else { if(vCanvas.lastElementChild !== vLogoBox) vCanvas.appendChild(vLogoBox); }
        }
    }
    logoScale.addEventListener('input', (e) => { logoScaleLbl.textContent = e.target.value + 'px'; drawLogoLayer(); });
    logoAlpha.addEventListener('input', (e) => { logoAlphaLbl.textContent = e.target.value; drawLogoLayer(); });

    function buildHighResCanvas(callback) {
        document.fonts.ready.then(() => {
            const scale = 3;
            const rect = vCanvas.getBoundingClientRect();
            const targetW = rect.width * scale;
            const targetH = rect.height * scale;

            const mainCanvas = document.createElement('canvas');
            mainCanvas.width = targetW; mainCanvas.height = targetH;
            const ctx = mainCanvas.getContext('2d');

            ctx.fillStyle = window.getComputedStyle(vCanvas).backgroundColor;
            ctx.fillRect(0, 0, targetW, targetH);

            function renderDomNodeToCanvas(el, type) {
                if (el.classList.contains('node-hidden') || window.getComputedStyle(el).display === 'none') return;
                const nodeRect = el.getBoundingClientRect();
                const relativeX = (nodeRect.left - rect.left) * scale;
                const relativeY = (nodeRect.top - rect.top) * scale;
                const nodeW = nodeRect.width * scale;
                const nodeH = nodeRect.height * scale;

                if (type === 'image') {
                    const imgNode = el.querySelector('img');
                    if (imgNode && imgNode.src && imgNode.complete) {
                        ctx.save(); ctx.globalAlpha = parseFloat(window.getComputedStyle(imgNode).opacity || 1);
                        const aspect = imgNode.naturalWidth / imgNode.naturalHeight;
                        let renderH = nodeH, renderW = nodeH * aspect;
                        let renderX = relativeX + (nodeW - renderW) / 2;
                        if (el.style.justifyContent === 'flex-start') renderX = relativeX;
                        if (el.style.justifyContent === 'flex-end') renderX = relativeX + nodeW - renderW;
                        if (el.id === 'vLogoCenterBox') { renderW = nodeW; renderH = nodeW / aspect; renderX = relativeX; }
                        ctx.drawImage(imgNode, renderX, relativeY, renderW, renderH);
                        ctx.restore();
                    }
                } else if (type === 'text') {
                    const rawText = el.innerText; if (!rawText.trim()) return;
                    ctx.save(); ctx.textBaseline = "top";
                    const computedStyle = window.getComputedStyle(el);
                    const fSize = parseFloat(computedStyle.fontSize) * scale;
                    ctx.font = `${computedStyle.fontStyle} ${computedStyle.fontWeight} ${fSize}px ${computedStyle.fontFamily}`;
                    ctx.fillStyle = computedStyle.color; ctx.strokeStyle = computedStyle.color;

                    const lines = rawText.split('\n');
                    let currentLineY = relativeY;
                    const lineHeight = parseFloat(computedStyle.lineHeight) * scale || (fSize * 1.4);
                    const lSpacing = parseFloat(computedStyle.letterSpacing) * scale || 0;
                    const align = computedStyle.textAlign;

                    lines.forEach(line => {
                        let lineW = 0;
                        if (lSpacing === 0) { lineW = ctx.measureText(line).width; } 
                        else { for (let i = 0; i < line.length; i++) { lineW += ctx.measureText(line[i]).width + (i < line.length - 1 ? lSpacing : 0); } }

                        let startX = relativeX;
                        if (align === 'center') startX = relativeX + (nodeW / 2) - (lineW / 2);
                        if (align === 'right') startX = relativeX + nodeW - lineW;

                        if (lSpacing === 0) { ctx.fillText(line, startX, currentLineY); } 
                        else {
                            let drawX = startX;
                            for (let i = 0; i < line.length; i++) { ctx.fillText(line[i], drawX, currentLineY); drawX += ctx.measureText(line[i]).width + lSpacing; }
                        }
                        currentLineY += lineHeight;
                    });
                    ctx.restore();
                }
            }
            renderDomNodeToCanvas(vLogoCenterBox, 'image');
            renderDomNodeToCanvas(vLogoBox, 'image');
            renderDomNodeToCanvas(vTitle, 'text');
            renderDomNodeToCanvas(vMainText, 'text');
            renderDomNodeToCanvas(vFooterText, 'text');
            callback(mainCanvas.toDataURL('image/png'), targetW, targetH);
        });
    }

    document.getElementById('btnExportImg').addEventListener('click', () => {
        buildHighResCanvas((url) => { const a = document.createElement('a'); a.download = `Toathmor_v3.8_${currentRatioMode}.png`; a.href = url; a.click(); });
    });
    document.getElementById('btnExportPdf').addEventListener('click', () => {
        buildHighResCanvas((url, w, h) => { const { jsPDF } = window.jspdf; const pdf = new jsPDF(w > h ? 'l' : 'p', 'px', [w, h]); pdf.addImage(url, 'PNG', 0, 0, w, h); pdf.save(`Toathmor_v3.8_${currentRatioMode}.pdf`); });
    });

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    themeToggleBtn.addEventListener('click', () => {
        const icon = themeToggleBtn.querySelector('i');
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
            document.documentElement.removeAttribute('data-theme'); icon.className = 'fa-solid fa-moon'; applyQuickPalette('#0b0f19', '#f8fafc', '#f8fafc', '#94a3b8');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark'); icon.className = 'fa-solid fa-sun'; applyQuickPalette('#070a12', '#f1f5f9', '#f1f5f9', '#64748b');
        }
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swBlob = new Blob([`
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => new Response("Offline"))); });
            `], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW registration skipped'));
        });
    }
</script>
